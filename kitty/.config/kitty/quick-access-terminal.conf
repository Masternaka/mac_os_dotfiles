## Terminal d'accès rapide (Quake-like) pour macOS

edge top
margin_top 0
lines 30
background_opacity 0.85
hide_on_focus_loss yes

# Le panneau utilise kitty.conf et ne conserve aucun état de fenêtre.
kitty_override font_size=14
kitty_override tab_bar_style=hidden
kitty_override remember_window_size=no
